<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AG_CELL">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>AG_CELL Servicio Técnico</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#047857;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#374151;display:grid;place-items:center;font-weight:800}
.headtext{flex:1}.headtext b{display:block;font-size:17px}.headtext small{opacity:.75}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#111827;color:#fff}.ghost{background:#eef0f3;color:#111827}.danger{background:#b91c1c}.good{background:#047857}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;background:#eef0f3;color:#111827}nav button.active{background:#111827;color:#fff}
main{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
.stat b{font-size:25px;display:block}.stat small,.muted{color:var(--muted)}
label{display:block;font-weight:650;font-size:13px;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}textarea{min-height:80px;resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}.scroll{overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0f3;font-size:12px}.ok{color:var(--good)}.err{color:var(--bad)}.warn{color:var(--warn)}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(430px,100%)}
.toast{position:fixed;right:15px;bottom:15px;z-index:20;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;max-width:360px}
.photos{display:flex;flex-wrap:wrap;gap:8px}.photos img{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.small{font-size:12px}.right{margin-left:auto}.dangerText{color:var(--bad)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two,.formgrid{grid-template-columns:1fr}main{padding:10px}th:nth-child(n+5),td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ddzluwdxhvtrvsbdysry.supabase.co";
const SUPABASE_KEY="sb_publishable_QNVJ2PExnWq-JWF6SbmkaA_apPylkNc";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const STORE="agcell_v8_cache", PINKEY="agcell_v8_pin", ENC_SALT="agcell-v8-secret-v1";
let state={tab:"inicio",profile:null,devices:[],orders:[],cash:[],photos:[],session:null,cryptoKey:null,cloud:true};
const $=id=>document.getElementById(id);
function toast(s,err=false){const t=$("toast");t.textContent=s;t.className="toast";if(err)t.style.background="#b91c1c";else t.style.background="#111827";clearTimeout(window._tt);window._tt=setTimeout(()=>t.className="toast hidden",3000)}
function money(n){return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function saveCache(){localStorage.setItem(STORE,JSON.stringify({profile:state.profile,devices:state.devices,orders:state.orders,cash:state.cash,photos:state.photos}))}
function loadCache(){try{const x=JSON.parse(localStorage.getItem(STORE)||"{}");Object.assign(state,{profile:x.profile||null,devices:x.devices||[],orders:x.orders||[],cash:x.cash||[],photos:x.photos||[]})}catch{}}
function pinSet(){return !!localStorage.getItem(PINKEY)}
function validPin(p){return /^\\d{4,8}$/.test(p)}
async function hashPin(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function unlockPin(){let p=prompt("PIN de AG_CELL:");if(!p)return false;const h=await hashPin(p);if(h!==localStorage.getItem(PINKEY)){toast("PIN incorrecto",true);return false}sessionStorage.setItem("agcell_unlocked","1");return true}
async function ensurePin(){if(!pinSet()){let p=prompt("Crea tu PIN de AG_CELL (4 a 8 dígitos):","1234");if(!validPin(p||"")){toast("PIN inválido",true);return false}localStorage.setItem(PINKEY,await hashPin(p));sessionStorage.setItem("agcell_unlocked","1");toast("PIN creado")}return true}
function locked(){return pinSet()&&!sessionStorage.getItem("agcell_unlocked")}
function render(){document.body.innerHTML=document.body.innerHTML; if(locked()){renderLogin();return} renderApp()}
function renderLogin(){document.getElementById("app").innerHTML=`<div class="login"><div class="box card"><h1>AG_CELL</h1><p class="muted">Servicio Técnico</p><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><div class="actions"><button onclick="doUnlock()">Entrar</button></div><hr><p class="small muted">El PIN es un bloqueo local adicional. Tus datos de nube usan la cuenta de Supabase.</p></div></div>`}
async function doUnlock(){const p=$("pin").value;const h=await hashPin(p);if(h===localStorage.getItem(PINKEY)){sessionStorage.setItem("agcell_unlocked","1");render()}else toast("PIN incorrecto",true)}
function renderApp(){const p=state.profile||{};document.getElementById("app").innerHTML=`
<header><div class="logo">${p.logo_url||p.logo_path?`<img src="${esc(p.logo_url||p.logo_path)}" style="width:44px;height:44px;border-radius:12px;object-fit:cover">`:"AG"}</div><div class="headtext"><b>${esc(p.shop_name||"AG_CELL Servicio Técnico")}</b><small>${esc(p.subtitle||"Gestión de reparación y servicio")}</small></div><button class="ghost" onclick="signOut()">Salir</button></header>
<nav>${["inicio","equipos","ordenes","caja","config"].map(x=>`<button class="${state.tab===x?"active":""}" onclick="state.tab='${x}';renderApp()">${({inicio:"Inicio",equipos:"Equipos",ordenes:"Órdenes",caja:"Caja",config:"Configuración"})[x]}</button>`).join("")}</nav><main id="main"></main>`;
if(state.tab==="inicio")home();if(state.tab==="equipos")devicesView();if(state.tab==="ordenes")ordersView();if(state.tab==="caja")cashView();if(state.tab==="config")configView()}
function home(){const inc=state.cash.filter(x=>x.type==="income").reduce((a,x)=>a+Number(x.value),0),exp=state.cash.filter(x=>x.type==="expense").reduce((a,x)=>a+Number(x.value),0),active=state.orders.filter(x=>!["Entregado","Cancelado"].includes(x.status)).length;
$("main").innerHTML=`<h2>Panel</h2><div class="grid"><div class="card stat"><small>Ingresos</small><b>${money(inc)}</b></div><div class="card stat"><small>Gastos</small><b>${money(exp)}</b></div><div class="card stat"><small>Balance</small><b>${money(inc-exp)}</b></div><div class="card stat"><small>Órdenes activas</small><b>${active}</b></div></div>
<div class="two"><div class="card"><h3>Estado de sincronización</h3><p class="ok">● ${state.cloud?"Conectado a Supabase":"Modo local"}</p><p class="small muted">La información se guarda en la nube cuando hay sesión y conexión.</p></div><div class="card"><h3>Acciones rápidas</h3><div class="actions"><button onclick="newDevice()">+ Recibir equipo</button><button class="ghost" onclick="newCash('income')">+ Ingreso</button><button class="ghost" onclick="newCash('expense')">+ Gasto</button></div></div></div>`}
function devicesView(){const q=prompt?null:null;$("main").innerHTML=`<div class="card"><div style="display:flex;gap:8px;align-items:center"><h2 style="margin:0">Equipos / Recepción</h2><button class="right" onclick="newDevice()">+ Recibir equipo</button></div><label>Buscar</label><input id="deviceSearch" oninput="listDevices()" placeholder="Cliente, teléfono, modelo, IMEI..."></div><div id="deviceList"></div>`;listDevices()}
function listDevices(){const q=($("deviceSearch")?.value||"").toLowerCase();const arr=state.devices.filter(d=>[d.customer_name,d.customer_phone,d.model,d.imei].join(" ").toLowerCase().includes(q));$("deviceList").innerHTML=arr.map(d=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(d.customer_name)} — ${esc(d.model)}</h3><p class="muted">${esc(d.imei||"Sin IMEI")} · ${esc(d.customer_phone||"Sin teléfono")}</p></div><span class="badge">${esc(d.lock_type||"Ninguno")}</span></div><p><b>Trabajo:</b> ${esc(d.work)}</p><p><b>Estado físico:</b> ${esc(d.condition)}</p><div class="photos">${state.photos.filter(x=>x.device_id===d.id).map(x=>`<img src="${esc(x.url)}" title="${esc(x.caption)}">`).join("")}</div><div class="actions"><button onclick="editDevice('${d.id}')">Editar</button><button class="ghost" onclick="showSecret('${d.id}')">Ver acceso</button><button class="ghost" onclick="photoInput('${d.id}')">Agregar fotos</button><button class="danger" onclick="deleteDevice('${d.id}')">Eliminar</button></div></div>`).join("")||`<div class="card"><p class="muted">No hay equipos registrados.</p></div>`}
function deviceForm(d={}){
  return `<div class="card">
    <h2>${d.id?"Editar":"Recibir"} equipo</h2>
    <div class="formgrid">
    
function newDevice(){state.tab="equipos";$("main").innerHTML=deviceForm();window.scrollTo(0,0)}
async function saveDevice(id){
  const old=state.devices.find(x=>x.id===id);
  const priceInput=$("f_price");
  const depositInput=$("f_deposit");
  const total=priceInput?Number(priceInput.value||0):0;
  const deposit=depositInput?Number(depositInput.value||0):0;

  if(!id && (total<0 || deposit<0 || deposit>total)){
    toast("Revisa el precio y el abono: el abono no puede superar el precio",true);
    return;
  }

  const d={
    id:id||crypto.randomUUID(),
    user_id:state.session.user.id,
    customer_name:$("f_name").value.trim(),
    customer_phone:$("f_phone").value.trim(),
    model:$("f_model").value.trim(),
    imei:$("f_imei").value.trim(),
    color:$("f_color").value.trim(),
    lock_type:$("f_lock").value,
    condition:$("f_condition").value.trim(),
    work:$("f_work").value.trim(),
    obs:$("f_obs").value.trim(),
    received_at:old?.received_at||new Date().toISOString(),
    updated_at:new Date().toISOString()
  };

  if(!d.customer_name||!d.model){
    toast("Cliente y modelo son obligatorios",true);
    return;
  }

  const secret=$("f_secret").value;
  if(secret){
    d.lock_secret_ciphertext=await encryptSecret(secret);
  }else if(old){
    d.lock_secret_ciphertext=old.lock_secret_ciphertext||null;
  }

  const {error}=await sb.from("devices").upsert(d);
  if(error){
    toast(error.message,true);
    return;
  }

  if(!id){
    const order={
      user_id:state.session.user.id,
      device_id:d.id,
      work:d.work,
      status:"Recibido",
      total,
      deposit,
      notes:d.obs,
      received_at:d.received_at,
      updated_at:new Date().toISOString()
    };

    const {data:createdOrder,error:orderError}=await sb
      .from("orders").insert(order).select().single();

    if(orderError){
      await sb.from("devices").delete().eq("id",d.id);
      toast("No se pudo crear la orden: "+orderError.message,true);
      return;
    }

    if(deposit>0){
      const movement={
        user_id:state.session.user.id,
        type:"income",
        value:deposit,
        method:"",
        concept:`Abono reparación - ${d.customer_name} - ${d.model}`,
        created_at:new Date().toISOString()
      };

      const {error:cashError}=await sb.from("cash_entries").insert(movement);

      if(cashError){
        state.devices=[...state.devices.filter(x=>x.id!==d.id),d];
        state.orders=[...state.orders.filter(x=>x.id!==createdOrder.id),createdOrder];
        saveCache();
        toast("Equipo y orden guardados, pero falló el ingreso en Caja: "+cashError.message,true);
        devicesView();
        return;
      }

      state.cash.unshift(movement);
    }

    state.orders=[...state.orders.filter(x=>x.id!==createdOrder.id),createdOrder];
  }

  state.devices=[...state.devices.filter(x=>x.id!==d.id),d];
  saveCache();
  toast(id?"Equipo actualizado":"Equipo y orden guardados");
  devicesView();
}
const secret=$("f_secret").value;if(secret){d.lock_secret_ciphertext=await encryptSecret(secret)}else if(old)d.lock_secret_ciphertext=old.lock_secret_ciphertext||null;
const {error}=await sb.from("devices").upsert(d);if(error){toast(error.message,true);return}state.devices=[...state.devices.filter(x=>x.id!==d.id),d];saveCache();toast("Equipo guardado");devicesView()}
function editDevice(id){state.tab="equipos";$("main").innerHTML=deviceForm(state.devices.find(x=>x.id===id)||{})}

async function deleteDevice(id){
  const device=state.devices.find(x=>x.id===id);
  if(!device){
    toast("No se encontró el equipo",true);
    return;
  }

  const relatedOrders=state.orders.filter(o=>o.device_id===id);

  const message=relatedOrders.length
    ? `Este equipo tiene ${relatedOrders.length} pedido(s) asociado(s). Si continúas, también se eliminarán esos pedidos. ¿Deseas continuar?`
    : "¿Eliminar este equipo y sus fotos?";

  if(!confirm(message)) return;

  if(relatedOrders.length){
    const {error:ordersError}=await sb
      .from("orders")
      .delete()
      .eq("device_id",id);

    if(ordersError){
      toast("No se pudieron eliminar los pedidos: "+ordersError.message,true);
      return;
    }
  }

  const {error}=await sb.from("devices").delete().eq("id",id);

  if(error){
    toast("No se pudo eliminar el equipo: "+error.message,true);
    return;
  }

  state.orders=state.orders.filter(o=>o.device_id!==id);
  state.devices=state.devices.filter(x=>x.id!==id);
  state.photos=state.photos.filter(x=>x.device_id!==id);

  saveCache();
  listDevices();
  toast("Equipo y pedidos asociados eliminados");
}
async function showSecret(id){const d=state.devices.find(x=>x.id===id);if(!d?.lock_secret_ciphertext){toast("No hay acceso guardado");return}const s=await decryptSecret(d.lock_secret_ciphertext);alert(s||"No se pudo descifrar. Vuelve a introducir la contraseña de tu cuenta.");}
async function encryptSecret(s){if(!state.cryptoKey)return null;const iv=crypto.getRandomValues(new Uint8Array(12));const enc=new TextEncoder();const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},state.cryptoKey,enc.encode(s));return JSON.stringify({iv:b64(iv),ct:b64(new Uint8Array(ct))})}
async function decryptSecret(v){try{if(!state.cryptoKey)return null;const x=JSON.parse(v);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(x.iv)},state.cryptoKey,ub64(x.ct));return new TextDecoder().decode(pt)}catch{return null}}
function b64(a){return btoa(String.fromCharCode(...a))}function ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function deriveKey(password){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode(ENC_SALT),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function ordersView(){const rows=state.orders.map(o=>{const d=state.devices.find(x=>x.id===o.device_id)||{};return `<tr><td>#${o.number||"—"}</td><td>${esc(d.customer_name||"—")}<br>${esc(d.model||"")}</td><td>${esc(o.status)}</td><td>${money(o.total)}</td><td>${money(o.deposit)}</td><td>${money(Number(o.total)-Number(o.deposit))}</td><td><button onclick="editOrder('${o.id}')">Editar</button></td></tr>`}).join("");$("main").innerHTML=`<div class="card"><div style="display:flex;align-items:center"><h2>Órdenes</h2><button class="right" onclick="newOrder()">+ Nueva orden</button></div><div class="scroll"><table><thead><tr><th>N°</th><th>Equipo</th><th>Estado</th><th>Total</th><th>Abono</th><th>Saldo</th><th></th></tr></thead><tbody>${rows||"<tr><td colspan=7>No hay órdenes.</td></tr>"}</tbody></table></div></div>`}
function orderForm(o={}){return `<div class="card"><h2>${o.id?"Editar orden":"Nueva orden"}</h2><label>Equipo</label><select id="o_device">${state.devices.map(d=>`<option value="${d.id}" ${o.device_id===d.id?"selected":""}>${esc(d.customer_name)} — ${esc(d.model)} ${d.imei?"· "+esc(d.imei):""}</option>`).join("")}</select><div class="formgrid"><div><label>Trabajo</label><textarea id="o_work">${esc(o.work)}</textarea></div><div><label>Estado</label><select id="o_status">${["Recibido","En reparación","Listo","Entregado","Cancelado"].map(x=>`<option ${o.status===x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Total</label><input id="o_total" type="number" min="0" value="${o.total||0}"></div><div><label>Abono</label><input id="o_deposit" type="number" min="0" value="${o.deposit||0}"></div><div class="full"><label>Notas</label><textarea id="o_notes">${esc(o.notes)}</textarea></div></div><div class="actions"><button onclick="saveOrder('${o.id||""}')">Guardar</button><button class="ghost" onclick="ordersView()">Cancelar</button></div></div>`}
function newOrder(){if(!state.devices.length){toast("Primero recibe un equipo",true);newDevice();return}state.tab="ordenes";$("main").innerHTML=orderForm()}
function editOrder(id){state.tab="ordenes";$("main").innerHTML=orderForm(state.orders.find(x=>x.id===id)||{})}
async function saveOrder(id){const old=state.orders.find(x=>x.id===id),total=Number($("o_total").value||0),dep=Number($("o_deposit").value||0);if(dep>total){toast("El abono no puede superar el total",true);return}const o={id:id||crypto.randomUUID(),user_id:state.session.user.id,device_id:$("o_device").value,work:$("o_work").value,status:$("o_status").value,total,deposit:dep,notes:$("o_notes").value,received_at:old?.received_at||new Date().toISOString(),updated_at:new Date().toISOString()};const {data,error}=await sb.from("orders").upsert(o).select().single();if(error){toast(error.message,true);return}state.orders=[...state.orders.filter(x=>x.id!==o.id),data];saveCache();toast("Orden guardada");ordersView()}
function cashView(){
  const inc=state.cash.filter(x=>x.type==="income").reduce((a,x)=>a+Number(x.value),0);
  const exp=state.cash.filter(x=>x.type==="expense").reduce((a,x)=>a+Number(x.value),0);

  $("main").innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center">
        <h2>Caja</h2>
        <div class="right actions">
          <button onclick="newCash('income')">+ Ingreso</button>
          <button class="danger" onclick="newCash('expense')">+ Gasto</button>
        </div>
      </div>
      <p>Ingresos: <b>${money(inc)}</b> · Gastos: <b>${money(exp)}</b> · Balance: <b>${money(inc-exp)}</b></p>
    </div>
    <div class="card scroll">
      <table>
        <thead>
          <tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th>Método</th><th>Concepto</th><th>Acción</th></tr>
        </thead>
        <tbody>
          ${state.cash.map(x=>`
            <tr>
              <td>${new Date(x.created_at).toLocaleString("es-CO")}</td>
              <td>${x.type==="income"?"Ingreso":"Gasto"}</td>
              <td>${money(x.value)}</td>
              <td>${esc(x.method)}</td>
              <td>${esc(x.concept)}</td>
              <td><button class="danger" onclick="deleteCash('${x.id}')">Eliminar</button></td>
            </tr>
          `).join("")||"<tr><td colspan=6>No hay movimientos.</td></tr>"}
        </tbody>
      </table>
    </div>`;
}
async function deleteCash(id){
  const movimiento=state.cash.find(x=>x.id===id);
  if(!movimiento){
    toast("No se encontró el movimiento",true);
    return;
  }

  if(!confirm("¿Eliminar este movimiento de Caja? Esta acción cambiará el balance. Continúa solo si el registro es incorrecto o de prueba.")){
    return;
  }

  const {error}=await sb
    .from("cash_entries")
    .delete()
    .eq("id",id)
    .eq("user_id",state.session.user.id);

  if(error){
    toast("No se pudo eliminar: "+error.message,true);
    return;
  }

  state.cash=state.cash.filter(x=>x.id!==id);
  saveCache();
  cashView();
  toast("Movimiento eliminado");
}
function configView(){const p=state.profile||{};$("main").innerHTML=`<div class="two"><div class="card"><h2>Perfil del negocio</h2><div style="display:flex;align-items:center;gap:14px;margin-bottom:14px"><div class="logo" style="width:72px;height:72px;border-radius:18px;font-size:22px;overflow:hidden">${p.logo_url||p.logo_path?`<img src="${esc(p.logo_url||p.logo_path)}" style="width:72px;height:72px;object-fit:cover">`:'AG'}</div><div><label>Foto / logo de perfil</label><input id="p_logo_file" type="file" accept="image/*" onchange="previewLogo()"><p class="small muted">Elige una foto desde el celular o computador.</p></div></div><div class="formgrid"><div class="full"><label>Nombre</label><input id="p_name" value="${esc(p.shop_name||"AG_CELL Servicio Técnico")}"></div><div class="full"><label>Descripción</label><input id="p_sub" value="${esc(p.subtitle||"Gestión de reparación y servicio")}"></div><div><label>Teléfono</label><input id="p_phone" value="${esc(p.phone||"")}"></div><div><label>Correo</label><input id="p_email" value="${esc(p.email||"")}"></div><div class="full"><label>Dirección</label><input id="p_address" value="${esc(p.address||"")}"></div></div><div class="actions"><button onclick="saveProfile()">Guardar perfil</button><button class="ghost" onclick="installAGCell()">📲 Instalar AG_CELL</button></div></div><div class="card"><h2>Seguridad</h2><p class="small muted">El PIN bloquea la aplicación en este dispositivo. Los accesos de equipos se cifran antes de enviarse a Supabase usando la contraseña de tu cuenta.</p><button onclick="changePin()">Cambiar PIN</button><button class="ghost" onclick="sessionStorage.removeItem('agcell_unlocked');render()">Bloquear ahora</button></div></div>`}
async function saveProfile(){const p={id:state.profile?.id||crypto.randomUUID(),user_id:state.session.user.id,shop_name:$("p_name").value.trim()||"AG_CELL Servicio Técnico",subtitle:$("p_sub").value.trim(),phone:$("p_phone").value.trim(),email:$("p_email").value.trim(),address:$("p_address").value.trim(),logo_path:state.profile?.logo_path||null,updated_at:new Date().toISOString()};const file=$("p_logo_file")?.files?.[0];if(file){if(file.size>3*1024*1024){toast("La foto supera 3 MB",true);return}const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=`${state.session.user.id}/profile/logo-${crypto.randomUUID()}.${ext}`;const {error:upErr}=await sb.storage.from("agcell-photos").upload(path,file,{upsert:false});if(upErr){toast(upErr.message,true);return}p.logo_path=path}const {data,error}=await sb.from("business_profiles").upsert(p).select().single();if(error){toast(error.message,true);return}state.profile=data;state.profile.logo_url=null;if(data.logo_path){const signed=await sb.storage.from("agcell-photos").createSignedUrl(data.logo_path,60*60*24*7);if(signed.data?.signedUrl)state.profile.logo_url=signed.data.signedUrl}saveCache();renderApp();toast("Perfil guardado")}
async function installAGCell(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();const result=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}toast("Si tu navegador no muestra la instalación automática, usa el menú del navegador y elige 'Instalar aplicación' o 'Agregar a pantalla de inicio'.")}
function previewLogo(){const file=$("p_logo_file")?.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{const box=document.querySelector('.card .logo');if(box)box.innerHTML=`<img src="${r.result}" style="width:72px;height:72px;object-fit:cover">`};r.readAsDataURL(file)}
async function changePin(){const old=prompt("PIN actual");if(await hashPin(old||"")!==localStorage.getItem(PINKEY)){toast("PIN actual incorrecto",true);return}const p=prompt("Nuevo PIN (4 a 8 dígitos)");if(!validPin(p||"")){toast("PIN inválido",true);return}localStorage.setItem(PINKEY,await hashPin(p));toast("PIN cambiado")}
function photoInput(deviceId){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=()=>uploadPhotos(deviceId,[...i.files]);i.click()}
async function uploadPhotos(deviceId,files){for(const file of files.slice(0,8)){if(file.size>3*1024*1024){toast("Una foto supera 3 MB",true);continue}const path=`${state.session.user.id}/${deviceId}/${crypto.randomUUID()}.${(file.name.split(".").pop()||"jpg").toLowerCase()}`;const {error}=await sb.storage.from("agcell-photos").upload(path,file,{upsert:false});if(error){toast(error.message,true);continue}const rec={id:crypto.randomUUID(),user_id:state.session.user.id,device_id:deviceId,storage_path:path,caption:"",created_at:new Date().toISOString(),url:""};const {error:e}=await sb.from("device_photos").insert({id:rec.id,user_id:rec.user_id,device_id:rec.device_id,storage_path:rec.storage_path,caption:""});if(e){toast(e.message,true);continue}const signed=await sb.storage.from("agcell-photos").createSignedUrl(path,3600);rec.url=signed.data?.signedUrl||"";state.photos.push(rec)}saveCache();listDevices();toast("Fotos subidas")}
async function loadCloud(){if(!state.session)return;const uid=state.session.user.id;const [p,d,o,c,ph]=await Promise.all([sb.from("business_profiles").select("*").eq("user_id",uid).maybeSingle(),sb.from("devices").select("*").order("updated_at",{ascending:false}),sb.from("orders").select("*").order("updated_at",{ascending:false}),sb.from("cash_entries").select("*").order("created_at",{ascending:false}),sb.from("device_photos").select("*").order("created_at",{ascending:false})]);for(const x of [p,d,o,c,ph])if(x.error){toast(x.error.message,true);return}state.profile=p.data;
if(state.profile?.logo_path){const signedLogo=await sb.storage.from("agcell-photos").createSignedUrl(state.profile.logo_path,60*60*24*7);state.profile.logo_url=signedLogo.data?.signedUrl||""}
state.devices=d.data||[];state.orders=o.data||[];state.cash=c.data||[];state.photos=[];for(const x of (ph.data||[])){const signed=await sb.storage.from("agcell-photos").createSignedUrl(x.storage_path,3600);state.photos.push({...x,url:signed.data?.signedUrl||""})}saveCache()}
async function signOut(){await sb.auth.signOut();sessionStorage.removeItem("agcell_unlocked");location.reload()}
async function boot(){loadCache();const {data}=await sb.auth.getSession();state.session=data.session;if(!state.session){showAuth();return}if(locked()){render();return}await loadCloud();render()}
function showAuth(){document.getElementById("app").innerHTML=`<div class="login"><div class="box card"><h1>AG_CELL</h1><p>Conecta tu cuenta para sincronizar entre celular y computador.</p><label>Correo</label><input id="auth_email" type="email" placeholder="tu-correo@ejemplo.com"><label>Contraseña</label><input id="auth_pass" type="password" placeholder="Mínimo 6 caracteres"><div class="actions"><button onclick="authLogin()">Entrar</button><button class="ghost" onclick="authSignup()">Crear cuenta</button></div><p class="small muted">Si acabas de crear la cuenta, Supabase puede pedir confirmación del correo según la configuración del proyecto.</p></div></div>`}
async function authLogin(){const {data,error}=await sb.auth.signInWithPassword({email:$("auth_email").value.trim(),password:$("auth_pass").value});if(error){toast(error.message,true);return}state.session=data.session;state.cryptoKey=await deriveKey($("auth_pass").value);await ensurePin();await loadCloud();render()}
async function authSignup(){const email=$("auth_email").value.trim(),password=$("auth_pass").value;if(!email||password.length<6){toast("Correo y contraseña válida son obligatorios",true);return}const {data,error}=await sb.auth.signUp({email,password});if(error){toast(error.message,true);return}if(data.session){state.session=data.session;state.cryptoKey=await deriveKey(password);await ensurePin();await loadCloud();render()}else toast("Cuenta creada. Revisa tu correo para confirmar y luego entra.")}
sb.auth.onAuthStateChange((_event,session)=>{state.session=session});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;window.dispatchEvent(new Event("agcell-install-ready"));});
boot();
</script>
</body>
</html>
