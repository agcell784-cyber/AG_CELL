<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#047857;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#374151;display:grid;place-items:center;font-weight:800}
.headtext{flex:1}.headtext b{display:block;font-size:17px}.headtext small{opacity:.75}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#111827;color:#fff}.ghost{background:#eef0f3;color:#111827}.danger{background:#b91c1c}.good{background:#047857}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;background:#eef0f3;color:#111827}nav button.active{background:#111827;color:#fff}
main{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
.stat b{font-size:25px;display:block}.stat small,.muted{color:var(--muted)}
label{display:block;font-weight:650;font-size:13px;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}textarea{min-height:80px;resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}.scroll{overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0f3;font-size:12px}.ok{color:var(--good)}.err{color:var(--bad)}.warn{color:var(--warn)}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(430px,100%)}
.toast{position:fixed;right:15px;bottom:15px;z-index:20;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;max-width:360px}
.photos{display:flex;flex-wrap:wrap;gap:8px}.photos img{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.small{font-size:12px}.right{margin-left:auto}.dangerText{color:var(--bad)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two,.formgrid{grid-template-columns:1fr}main{padding:10px}th:nth-child(n+5),td:nth-child(n+5){display:none}}

<script>
const SUPABASE_URL="https://fuxejnekvmxzvanklqok.supabase.co";
const SUPABASE_KEY="sb_publishable_NIOO0ix0-oHona8uaTQhFg_vxuoKMMG";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const STORE="agcell_v9_cache", PINKEY="agcell_v9_pin", ENC_SALT="agcell-v9-secret-v1";
let state={tab:"inicio",profile:null,devices:[],orders:[],cash:[],photos:[],inventory:[],repairCosts:[],session:null,cryptoKey:null,cloud:true};
const $=id=>document.getElementById(id);
function toast(s,err=false){const t=$("toast");t.textContent=s;t.className="toast";if(err)t.style.background="#b91c1c";else t.style.background="#111827";clearTimeout(window._tt);window._tt=setTimeout(()=>t.className="toast hidden",3000)}
function money(n){return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function saveCache(){localStorage.setItem(STORE,JSON.stringify({profile:state.profile,devices:state.devices,orders:state.orders,cash:state.cash,photos:state.photos,inventory:state.inventory||[]}))}
function loadCache(){try{const x=JSON.parse(localStorage.getItem(STORE)||"{}");Object.assign(state,{profile:x.profile||null,devices:x.devices||[],orders:x.orders||[],cash:x.cash||[],photos:x.photos||[],inventory:x.inventory||[]})}catch{}}
function pinSet(){return !!localStorage.getItem(PINKEY)}
function validPin(p){return /^\d{4,8}$/.test(p)}
async function hashPin(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function unlockPin(){let p=prompt("PIN de AG_CELL:");if(!p)return false;const h=await hashPin(p);if(h!==localStorage.getItem(PINKEY)){toast("PIN incorrecto",true);return false}sessionStorage.setItem("agcell_unlocked","1");return true}
async function ensurePin(){if(!pinSet()){let p=prompt("Crea tu PIN de AG_CELL (4 a 8 dígitos):","1234");if(!validPin(p||"")){toast("PIN inválido",true);return false}localStorage.setItem(PINKEY,await hashPin(p));sessionStorage.setItem("agcell_unlocked","1");toast("PIN creado")}return true}
function locked(){return pinSet()&&!sessionStorage.getItem("agcell_unlocked")}
function render(){if(locked()){renderLogin();return} renderApp()}
function renderLogin(){document.getElementById("app").innerHTML=`<div class="login"><div class="box card"><h1>AG_CELL</h1><p class="muted">Servicio Técnico</p><p><b>La tecnología merece una segunda oportunidad</b></p><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><div class="actions"><button onclick="doUnlock()">Entrar</button></div><hr><p class="small muted">El PIN es un bloqueo local adicional. Tus datos de nube usan la cuenta de Supabase.</p></div></div>`}
async function doUnlock(){const p=$("pin").value;const h=await hashPin(p);if(h===localStorage.getItem(PINKEY)){sessionStorage.setItem("agcell_unlocked","1");render()}else toast("PIN incorrecto",true)}
function renderApp(){const p=state.profile||{};document.getElementById("app").innerHTML=`
<header><div class="logo">${p.logo_url||p.logo_path?`<img src="${esc(p.logo_url||p.logo_path)}" style="width:44px;height:44px;border-radius:12px;object-fit:cover">`:"AG"}</div><div class="headtext"><b>${esc(p.shop_name||"AG_CELL Servicio Técnico")}</b><small>${esc(p.subtitle||"La tecnología merece una segunda oportunidad")}</small></div><button class="ghost" onclick="signOut()">Salir</button></header>
<nav>${["inicio","equipos","ordenes","inventario","caja","config"].map(x=>`<button class="${state.tab===x?"active":""}" onclick="state.tab='${x}';renderApp()">${({inicio:"Inicio",equipos:"Equipos",ordenes:"Órdenes",inventario:"Inventario",caja:"Caja",config:"Configuración"})[x]}</button>`).join("")}</nav><main id="main"></main>`;
if(state.tab==="inicio")home();if(state.tab==="equipos")devicesView();if(state.tab==="ordenes")ordersView();if(state.tab==="inventario")inventoryView();if(state.tab==="caja")cashView();if(state.tab==="config")configView()}
function home(){const inc=state.cash.filter(x=>x.type==="income").reduce((a,x)=>a+Number(x.value),0),exp=state.cash.filter(x=>x.type==="expense").reduce((a,x)=>a+Number(x.value),0),active=state.orders.filter(x=>!["Entregado","Cancelado"].includes(x.status)).length;
$("main").innerHTML=`<h2>Panel</h2><div class="grid"><div class="card stat"><small>Ingresos</small><b>${money(inc)}</b></div><div class="card stat"><small>Gastos</small><b>${money(exp)}</b></div><div class="card stat"><small>Balance</small><b>${money(inc-exp)}</b></div><div class="card stat"><small>Órdenes activas</small><b>${active}</b></div></div>
<div class="two"><div class="card"><h3>Estado de sincronización</h3><p class="ok">● ${state.cloud?"Conectado a Supabase":"Modo local"}</p><p class="small muted">La información se guarda en la nube cuando hay sesión y conexión.</p></div><div class="card"><h3>Acciones rápidas</h3><div class="actions"><button onclick="newDevice()">+ Recibir equipo</button><button class="ghost" onclick="newCash('income')">+ Ingreso</button><button class="ghost" onclick="newCash('expense')">+ Gasto</button></div></div></div>`}
async function newCash(type){
  const tipo=type==="income"?"Ingreso":"Gasto";

  const valor=prompt("Valor del "+tipo+":");
  if(valor===null)return;

  const amount=Number(valor.replace(/\./g,"").replace(/,/g,""));
  if(!amount||amount<=0){
    toast("Ingresa un valor válido",true);
    return;
  }

  const method=prompt("Método de pago (Efectivo, Nequi, Bancolombia, etc.):");
  if(method===null)return;

  const concept=prompt("Concepto del "+tipo+":");
  if(concept===null)return;

  const rec={
    id:crypto.randomUUID(),
    user_id:state.session.user.id,
    device_id:null,
    type:type,
    value:amount,
    method:method.trim(),
    concept:concept.trim(),
    created_at:new Date().toISOString()
  };

  const {data,error}=await sb
    .from("cash_entries")
    .insert(rec)
    .select()
    .single();

  if(error){
    toast("No se pudo guardar: "+error.message,true);
    return;
  }

  state.cash.unshift(data);
  saveCache();
  cashView();
  toast(tipo+" registrado correctamente");
}
  function devicesView(){const q=prompt?null:null;$("main").innerHTML=`<div class="card"><div style="display:flex;gap:8px;align-items:center"><h2 style="margin:0">Equipos / Recepción</h2><button class="right" onclick="newDevice()">+ Recibir equipo</button></div><label>Buscar</label><input id="deviceSearch" oninput="listDevices()" placeholder="Cliente, teléfono, modelo, IMEI..."></div><div id="deviceList"></div>`;listDevices()}
function listDevices(){
  const q=($("deviceSearch")?.value||"").toLowerCase().trim();

  const items=(state.devices||[]).filter(d=>
    [d.customer_name,d.customer_phone,d.model,d.imei]
      .some(v=>String(v||"").toLowerCase().includes(q))
  );

  $("deviceList").innerHTML=items.map(d=>{
    const photos=(state.photos||[]).filter(p=>p.device_id===d.id);

    return `
      <div class="card">
        <h3>${esc(d.customer_name||"Sin nombre")}</h3>
        <p><b>Equipo:</b> ${esc(d.model||"")}</p>
        <p><b>Teléfono:</b> ${esc(d.customer_phone||"—")}</p>
        <p><b>IMEI:</b> ${esc(d.imei||"—")}</p>
        <p><b>Trabajo:</b> ${esc(d.work||"—")}</p>
        <p><b>Precio:</b> ${money(d.total||0)}</p>
        <p><b>Abono:</b> ${money(d.deposit||0)}</p>
        <div class="actions">
          <button onclick="editDevice('${d.id}')">Editar</button>
          <button onclick="photoInput('${d.id}')">Agregar fotos</button>
          <button class="danger" onclick="deleteDevice('${d.id}')">Eliminar</button>
        </div>
        ${photos.map(p=>p.url?`<img src="${esc(p.url)}" style="width:75px;height:75px;object-fit:cover;border-radius:8px;margin:5px">`:"").join("")}
      </div>`;
  }).join("")||'<div class="card">No hay equipos registrados.</div>';
}
function editDevice(id) {
  const device = state.devices.find(x => x.id === id);
  if (!device) {
    toast("No se encontró el equipo", true);
    return;
  }
  state.tab = "equipos";
  $("main").innerHTML = deviceForm(device);
  togglePatternInput();
  setupPatternCanvas();
  window.scrollTo(0, 0);
}

  
function deviceForm(d={}){
  return `<div class="card">
    <h2>${d.id?"Editar":"Recibir"} equipo</h2>
    <div class="formgrid">
      <div><label>Nombre del cliente *</label><input id="f_name" value="${esc(d.customer_name||"")}" required></div>
      <div><label>Teléfono</label><input id="f_phone" value="${esc(d.customer_phone||"")}"></div>
      <div><label>Modelo del equipo *</label><input id="f_model" value="${esc(d.model||"")}" required></div>
      <div><label>IMEI</label><input id="f_imei" value="${esc(d.imei||"")}"></div>
      <div><label>Color</label><input id="f_color" value="${esc(d.color||"")}"></div>
      <div><label>Tipo de bloqueo</label>
        <select id="f_lock" onchange="togglePatternInput()">
          ${["Ninguno","PIN","Patrón","Contraseña","Cuenta Google","Cuenta Apple"].map(x=>`<option ${d.lock_type===x?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>
      <div><label>Estado físico</label><textarea id="f_condition">${esc(d.condition||"")}</textarea></div>
      <div><label>Trabajo solicitado</label><textarea id="f_work">${esc(d.work||"")}</textarea></div>
      <div class="full"><label>Observaciones</label><textarea id="f_obs">${esc(d.obs||"")}</textarea></div>
      <div class="full"><label>PIN, patrón o contraseña del equipo (solo con autorización del cliente)</label><input id="f_secret" type="password" autocomplete="off" placeholder="PIN o contraseña; para patrón, dibújalo abajo"><div id="patternWrap" class="hidden"><label>Dibuja el patrón uniendo los puntos</label><canvas id="patternCanvas" width="300" height="300" style="width:min(100%,300px);height:auto;border:1px solid #d1d5db;border-radius:14px;background:#f9fafb;touch-action:none"></canvas><div class="actions"><button type="button" class="ghost" onclick="clearPattern()">Borrar patrón</button></div><p class="small muted">Se guarda cifrado. Pide permiso al cliente y elimina el acceso cuando ya no sea necesario.</p></div></div>
      <div><label>Precio del trabajo (COP)</label><input id="f_price" type="number" min="0" value="${d.total??0}"></div>
      <div><label>Abono recibido (COP)</label><input id="f_deposit" type="number" min="0" value="${d.deposit??0}"></div>
      <div><label>Costo de repuestos (COP)</label><input id="f_parts_cost" type="number" min="0" value="${d.id ? (state.repairCosts||[]).filter(x=>x.device_id===d.id && x.description==="Repuestos").reduce((a,x)=>a+Number(x.quantity)*Number(x.unit_cost),0) : 0}"></div>
<div><label>Otros costos (COP)</label><input id="f_other_cost" type="number" min="0" value="${d.id ? (state.repairCosts||[]).filter(x=>x.device_id===d.id && x.description==="Otros costos").reduce((a,x)=>a+Number(x.quantity)*Number(x.unit_cost),0) : 0}"></div>
    </div>
    <div class="actions">

}

    

let drawnPattern=[];
function togglePatternInput(){
  const isPattern=$("f_lock")?.value==="Patrón";
  $("patternWrap")?.classList.toggle("hidden",!isPattern);
  if(isPattern) setTimeout(drawPatternGrid,20);
}
function drawPatternGrid(){
  const c=$("patternCanvas"); if(!c)return;
  const ctx=c.getContext("2d"),w=c.width,h=c.height;
  ctx.clearRect(0,0,w,h);ctx.strokeStyle="#9ca3af";ctx.lineWidth=2;
  const pts=[];for(let r=0;r<3;r++)for(let col=0;col<3;col++)pts.push({x:50+col*100,y:50+r*100,n:r*3+col+1});
  ctx.strokeStyle="#cbd5e1";
  for(let i=0;i<drawnPattern.length-1;i++){const a=pts.find(p=>p.n===drawnPattern[i]),b=pts.find(p=>p.n===drawnPattern[i+1]);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,drawnPattern.includes(p.n)?13:10,0,Math.PI*2);ctx.fillStyle=drawnPattern.includes(p.n)?"#047857":"#ffffff";ctx.fill();ctx.strokeStyle=drawnPattern.includes(p.n)?"#047857":"#475569";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=drawnPattern.includes(p.n)?"#fff":"#111827";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(p.n),p.x,p.y)});
}
function patternPoint(e){
 const c=$("patternCanvas");if(!c)return;
 const rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)*c.width/rect.width,y=(e.clientY-rect.top)*c.height/rect.height;
 let best=null,dist=Infinity;
 for(let r=0;r<3;r++)for(let col=0;col<3;col++){const p={x:50+col*100,y:50+r*100,n:r*3+col+1},d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=p}}
 if(best&&dist<35&&!drawnPattern.includes(best.n)){drawnPattern.push(best.n);drawPatternGrid()}
}
function clearPattern(){drawnPattern=[];drawPatternGrid()}
function setupPatternCanvas(){
 const c=$("patternCanvas");if(!c)return;
 c.onpointerdown=e=>{e.preventDefault();drawnPattern=[];c.setPointerCapture?.(e.pointerId);patternPoint(e)};
 c.onpointermove=e=>{if(e.buttons||e.pressure>0){e.preventDefault();patternPoint(e)}};
 c.onpointerup=e=>{e.preventDefault();if(drawnPattern.length<4){toast("El patrón debe unir al menos 4 puntos",true);drawnPattern=[];drawPatternGrid()}else{$("f_secret").value="PATRON:"+drawnPattern.join("-");toast("Patrón capturado")}};
 drawPatternGrid();
}

function newDevice() {
  state.tab = "equipos";
  $("main").innerHTML = deviceForm();
  togglePatternInput();setupPatternCanvas();
  window.scrollTo(0, 0);
}

async function saveDevice(id) {
  const old = state.devices.find(x => x.id === id);
  const priceInput = $("f_price");
  const depositInput = $("f_deposit");
  const total = priceInput ? Number(priceInput.value || 0) : 0;
  const deposit = depositInput ? Number(depositInput.value || 0) : 0;
  const partsCost = Number($("f_parts_cost")?.value || 0);
  const otherCost = Number($("f_other_cost")?.value || 0);

  if (partsCost < 0 || otherCost < 0) {
    toast("Los costos no pueden ser negativos", true);
    return;
  }
  if (total < 0 || deposit < 0 || deposit > total) {
    toast("Revisa el precio y el abono: el abono no puede superar el precio", true);
    return;
  }

  const d = {
    id: id || crypto.randomUUID(),
    user_id: state.session.user.id,
    customer_name: $("f_name").value.trim(),
    customer_phone: $("f_phone").value.trim(),
    model: $("f_model").value.trim(),
    imei: $("f_imei").value.trim(),
    color: $("f_color").value.trim(),
    lock_type: $("f_lock").value,
    condition: $("f_condition").value.trim(),
    work: $("f_work").value.trim(),
    obs: $("f_obs").value.trim(),
    total,
    deposit,
    received_at: old?.received_at || new Date().toISOString(),
    updated_at: new Date().toISOString()
  };

  if (!d.customer_name || !d.model) {
    toast("Cliente y modelo son obligatorios", true);
    return;
  }

  const secret = $("f_secret").value;

  if (secret) {
    d.lock_secret_ciphertext = await encryptSecret(secret);
  } else if (old) {
    d.lock_secret_ciphertext = old.lock_secret_ciphertext || null;
  }

  const { error } = await sb.from("devices").upsert(d);

  if (error) {
    toast(error.message, true);
    return;
  }

   const {error: oldCostsError}=await sb.from("repair_cost_items")
    .delete()
    .eq("device_id",d.id)
    .eq("user_id",state.session.user.id);

  if(oldCostsError){
    toast("No se pudieron actualizar los costos: "+oldCostsError.message,true);
    return;
  }

  const costRows=[];

  if(partsCost>0){
    costRows.push({
      id:crypto.randomUUID(),
      user_id:state.session.user.id,
      device_id:d.id,
      description:"Repuestos",
      quantity:1,
      unit_cost:partsCost
    });
  }

  if(otherCost>0){
    costRows.push({
      id:crypto.randomUUID(),
      user_id:state.session.user.id,
      device_id:d.id,
      description:"Otros costos",
      quantity:1,
      unit_cost:otherCost
    });
  }

  if(costRows.length){
    const {data:savedCosts,error:costError}=await sb
      .from("repair_cost_items")
      .insert(costRows)
      .select();

    if(costError){
      toast("Equipo guardado, pero fallaron los costos: "+costError.message,true);
      return;
    }

    state.repairCosts=[
      ...(state.repairCosts||[]).filter(x=>x.device_id!==d.id),
      ...(savedCosts||[])
    ];
  }else{
    state.repairCosts=(state.repairCosts||[]).filter(x=>x.device_id!==d.id);
  }
  state.devices = [
    ...state.devices.filter(x => x.id !== d.id),
    d
  ];

  if (!id) {
    const order = {
      id: crypto.randomUUID(),
      user_id: state.session.user.id,
      device_id: d.id,
      work: d.work,
      status: "Recibido",
      total,
      deposit,
      notes: d.obs,
      received_at: d.received_at,
      updated_at: new Date().toISOString()
    };

    const { data: createdOrder, error: orderError } =
      await sb.from("orders").insert(order).select().single();

    if (orderError) {
      saveCache();
      toast("Equipo guardado, pero falló la orden: " + orderError.message, true);
      devicesView();
      return;
    }

    state.orders = [
      ...state.orders.filter(x => x.id !== createdOrder.id),
      createdOrder
    ];

    if (deposit > 0) {
      const movement = {
        user_id: state.session.user.id,
        type: "income",
        value: deposit,
        method: "",
        concept: `Abono reparación - ${d.customer_name} - ${d.model}`,
        device_id: d.id,
        created_at: new Date().toISOString()
      };

      const { data: savedMovement, error: cashError } =
        await sb.from("cash_entries").insert(movement).select().single();

async function deleteDevice(id){

  const relatedOrders=state.orders.filter(o=>o.device_id===id);

  const message=`Se eliminará el equipo${relatedOrders.length?`, ${relatedOrders.length} orden(es)`:""}${relatedCash.length?` y ${relatedCash.length} movimiento(s) de caja asociado(s)`:""}. Esta acción no se puede deshacer. ¿Deseas continuar?`;
  if(!confirm(message)) return;

  // Eliminar primero movimientos vinculados para que la caja no conserve abonos de prueba.
  const {error:cashError}=await sb.from("cash_entries")
    .delete().eq("device_id",id).eq("user_id",state.session.user.id);

    toast("No se pudieron eliminar los movimientos de caja: "+cashError.message,true);
    return;

  const {error:ordersError}=await sb.from("orders")
    .delete().eq("device_id",id).eq("user_id",state.session.user.id);
  if(ordersError){
    toast("No se pudieron eliminar las órdenes: "+ordersError.message,true);

    .delete().eq("device_id",id).eq("user_id",state.session.user.id);
  if(photosError){
    toast("No se pudieron eliminar los registros de fotos: "+photosError.message,true);
    return;

  const {error}=await sb.from("devices").delete()
    .eq("id",id).eq("user_id",state.session.user.id);
  if(error){
    toast("No se pudo eliminar el equipo: "+error.message,true);

  state.cash=state.cash.filter(m=>m.device_id!==id);

  state.devices=state.devices.filter(x=>x.id!==id);

async function encryptSecret(s){if(!state.cryptoKey)return null;const iv=crypto.getRandomValues(new Uint8Array(12));const enc=new TextEncoder();const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},state.cryptoKey,enc.encode(s));return JSON.stringify({iv:b64(iv),ct:b64(new Uint8Array(ct))})}
async function decryptSecret(v){try{if(!state.cryptoKey)return null;const x=JSON.parse(v);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(x.iv)},state.cryptoKey,ub64(x.ct));return new TextDecoder().decode(pt)}catch{return null}}

}async function registrarPago(orderId){
  const order=state.orders.find(x=>x.id===orderId);

  if(!order){
    toast("No se encontró la orden",true);
    return;
  }

  const saldo=Number(order.total||0)-Number(order.deposit||0);

  if(saldo<=0){
    toast("Esta orden ya está pagada");
    return;
  }

  const valor=prompt(`Saldo pendiente: ${money(saldo)}\n\n¿Cuánto pagó el cliente?`);

  if(valor===null)return;

  const pago=Number(valor.replace(/\./g,"").replace(/,/g,""));

  if(!pago || pago<=0){
    toast("Ingresa un valor válido",true);
    return;
  }

  if(pago>saldo){
    toast("El pago no puede superar el saldo pendiente",true);
    return;
  }

  const nuevoDeposit=Number(order.deposit||0)+pago;

  const {data:updatedOrder,error:orderError}=await sb
    .from("orders")
    .update({
      deposit:nuevoDeposit,
      updated_at:new Date().toISOString()
    })
    .eq("id",orderId)
    .eq("user_id",state.session.user.id)
    .select()
    .single();

  if(orderError){
    toast("No se pudo actualizar el abono: "+orderError.message,true);
    return;
  }

  const d=state.devices.find(x=>x.id===order.device_id)||{};

  const movement={
    id:crypto.randomUUID(),
    user_id:state.session.user.id,
    device_id:order.device_id,
    type:"income",
    value:pago,
    method:"",
    concept:`Pago reparación - ${d.customer_name||"Cliente"} - ${d.model||""}`,
    created_at:new Date().toISOString()
  };

  const {data:savedMovement,error:cashError}=await sb
    .from("cash_entries")
    .insert(movement)
    .select()
    .single();

  if(cashError){
    toast("El abono se actualizó, pero falló el ingreso en Caja: "+cashError.message,true);
    return;
  }

  state.orders=[
    ...state.orders.filter(x=>x.id!==orderId),
    updatedOrder
  ];

  state.cash.unshift(savedMovement);

  const {data:updatedDevice,error:deviceError}=await sb
    .from("devices")
    .update({
      deposit:nuevoDeposit,
      updated_at:new Date().toISOString()
    })
    .eq("id",order.device_id)
    .eq("user_id",state.session.user.id)
    .select()
    .single();

  if(deviceError){
    saveCache();
    ordersView();
    toast("Pago registrado, pero no se actualizó el equipo: "+deviceError.message,true);
    return;
  }

  state.devices=[
    ...state.devices.filter(x=>x.id!==order.device_id),
    updatedDevice
  ];

  saveCache();
  ordersView();

  toast(`Pago de ${money(pago)} registrado correctamente`);
}

async function saveInventory(id){
 const name=$("i_name").value.trim(),stock=Number($("i_stock").value||0),min_stock=Number($("i_min").value||0),cost=Number($("i_cost").value||0),price=Number($("i_price").value||0);
 if(!name||[stock,min_stock,cost,price].some(n=>n<0)){toast("Revisa nombre y valores",true);return}
 const item={id:id||crypto.randomUUID(),user_id:state.session.user.id,name,sku:$("i_sku").value.trim(),stock,min_stock,cost,price,notes:$("i_notes").value.trim(),updated_at:new Date().toISOString()};
 const {data,error}=await sb.from("inventory_items").upsert(item).select().single();
 if(error){toast("No se guardó el inventario: "+error.message,true);return}
 state.inventory=state.inventory||[];state.inventory=[...state.inventory.filter(x=>x.id!==item.id),data];saveCache();inventoryView();toast("Artículo guardado");
}
async function deleteInventory(id){
 if(!confirm("¿Eliminar este artículo del inventario?"))return;
 const {error}=await sb.from("inventory_items").delete().eq("id",id).eq("user_id",state.session.user.id);
 if(error){toast("No se pudo eliminar: "+error.message,true);return}
 state.inventory=(state.inventory||[]).filter(x=>x.id!==id);saveCache();inventoryView();toast("Artículo eliminado");
}

async function deleteCash(id){
  const movimiento=state.cash.find(x=>x.id===id);
  if(!movimiento){
    toast("No se encontró el movimiento",true);
    return;
  }

  if(!confirm("¿Eliminar este movimiento de Caja? Esta acción cambiará el balance. Continúa solo si el registro es incorrecto o de prueba.")){
    return;
  }

  const {error}=await sb
    .from("cash_entries")
    .delete()
    .eq("id",id)
    .eq("user_id",state.session.user.id);

  if(error){
    toast("No se pudo eliminar: "+error.message,true);
    return;
  }

  state.cash=state.cash.filter(x=>x.id!==id);
  saveCache();
  cashView();
  toast("Movimiento eliminado");
}
function configView(){const p=state.profile||{};$("main").innerHTML=`<div class="two"><div class="card"><h2>Perfil del negocio</h2><div style="display:flex;align-items:center;gap:14px;margin-bottom:14px"><div class="logo" style="width:72px;height:72px;border-radius:18px;font-size:22px;overflow:hidden">${p.logo_url||p.logo_path?`<img src="${esc(p.logo_url||p.logo_path)}" style="width:72px;height:72px;object-fit:cover">`:'AG'}</div><div><label>Foto / logo de perfil</label><input id="p_logo_file" type="file" accept="image/*" onchange="previewLogo()"><p class="small muted">Elige una foto desde el celular o computador.</p></div></div><div class="formgrid"><div class="full"><label>Nombre</label><input id="p_name" value="${esc(p.shop_name||"AG_CELL Servicio Técnico")}"></div><div class="full"><label>Descripción</label><input id="p_sub" value="${esc(p.subtitle||"La tecnología merece una segunda oportunidad")}"></div><div><label>Teléfono</label><input id="p_phone" value="${esc(p.phone||"")}"></div><div><label>Correo</label><input id="p_email" value="${esc(p.email||"")}"></div><div class="full"><label>Dirección</label><input id="p_address" value="${esc(p.address||"")}"></div></div><div class="actions"><button onclick="saveProfile()">Guardar perfil</button><button class="ghost" onclick="installAGCell()">📲 Instalar AG_CELL</button></div></div><div class="card"><h2>Seguridad</h2><p class="small muted">El PIN bloquea la aplicación en este dispositivo. Los accesos de equipos se cifran antes de enviarse a Supabase usando la contraseña de tu cuenta.</p><button onclick="changePin()">Cambiar PIN</button><button class="ghost" onclick="sessionStorage.removeItem('agcell_unlocked');render()">Bloquear ahora</button></div></div>`}
async function saveProfile(){const p={id:state.profile?.id||crypto.randomUUID(),user_id:state.session.user.id,shop_name:$("p_name").value.trim()||"AG_CELL Servicio Técnico",subtitle:$("p_sub").value.trim(),phone:$("p_phone").value.trim(),email:$("p_email").value.trim(),address:$("p_address").value.trim(),logo_path:state.profile?.logo_path||null,updated_at:new Date().toISOString()};const file=$("p_logo_file")?.files?.[0];if(file){if(file.size>3*1024*1024){toast("La foto supera 3 MB",true);return}const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=`${state.session.user.id}/profile/logo-${crypto.randomUUID()}.${ext}`;const {error:upErr}=await sb.storage.from("agcell-photos").upload(path,file,{upsert:false});if(upErr){toast(upErr.message,true);return}p.logo_path=path}const {data,error}=await sb.from("business_profile").upsert(p).select().single();if(error){toast(error.message,true);return}state.profile=data;state.profile.logo_url=null;if(data.logo_path){const signed=await sb.storage.from("agcell-photos").createSignedUrl(data.logo_path,60*60*24*7);if(signed.data?.signedUrl)state.profile.logo_url=signed.data.signedUrl}saveCache();renderApp();toast("Perfil guardado")}
async function installAGCell(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();const result=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}toast("Si tu navegador no muestra la instalación automática, usa el menú del navegador y elige 'Instalar aplicación' o 'Agregar a pantalla de inicio'.")}
function previewLogo(){const file=$("p_logo_file")?.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{const box=document.querySelector('.card .logo');if(box)box.innerHTML=`<img src="${r.result}" style="width:72px;height:72px;object-fit:cover">`};r.readAsDataURL(file)}
async function changePin(){const old=prompt("PIN actual");if(await hashPin(old||"")!==localStorage.getItem(PINKEY)){toast("PIN actual incorrecto",true);return}const p=prompt("Nuevo PIN (4 a 8 dígitos)");if(!validPin(p||"")){toast("PIN inválido",true);return}localStorage.setItem(PINKEY,await hashPin(p));toast("PIN cambiado")}
function photoInput(deviceId){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=()=>uploadPhotos(deviceId,[...i.files]);i.click()}
async function uploadPhotos(deviceId,files){for(const file of files.slice(0,8)){if(file.size>3*1024*1024){toast("Una foto supera 3 MB",true);continue}const path=`${state.session.user.id}/${deviceId}/${crypto.randomUUID()}.${(file.name.split(".").pop()||"jpg").toLowerCase()}`;const {error}=await sb.storage.from("agcell-photos").upload(path,file,{upsert:false});if(error){toast(error.message,true);continue}const rec={id:crypto.randomUUID(),user_id:state.session.user.id,device_id:deviceId,storage_path:path,caption:"",created_at:new Date().toISOString(),url:""};const {error:e}=await sb.from("device_photos").insert({id:rec.id,user_id:rec.user_id,device_id:rec.device_id,storage_path:rec.storage_path,caption:""});if(e){toast(e.message,true);continue}const signed=await sb.storage.from("agcell-photos").createSignedUrl(path,3600);rec.url=signed.data?.signedUrl||"";state.photos.push(rec)}saveCache();listDevices();toast("Fotos subidas")}
async function loadCloud(){if(!state.session)return;const uid=state.session.user.id;const [p,d,o,c,ph,inv,rc]=await Promise.all([sb.from("business_profile").select("*").eq("user_id",uid).maybeSingle(),sb.from("devices").select("*").eq("user_id",uid).order("updated_at",{ascending:false}),sb.from("repair_cost_items").select("*").eq("user_id",uid).order("created_at",{ascending:false}),sb.from("orders").select("*").eq("user_id",uid).order("updated_at",{ascending:false}),sb.from("cash_entries").select("*").eq("user_id",uid).order("created_at",{ascending:false}),sb.from("device_photos").select("*").eq("user_id",uid).order("created_at",{ascending:false}),sb.from("inventory_items").select("*").eq("user_id",uid).order("updated_at",{ascending:false})]);for(const x of [p,d,o,c,ph])if(x.error){toast(x.error.message,true);return}if(inv.error && !/inventory_items|does not exist|schema cache/i.test(inv.error.message)){toast(inv.error.message,true);return}state.profile=p.data;
if(state.profile?.logo_path){const signedLogo=await sb.storage.from("agcell-photos").createSignedUrl(state.profile.logo_path,60*60*24*7);state.profile.logo_url=signedLogo.data?.signedUrl||""}
state.devices=d.data||[];state.orders=o.data||[];state.cash=c.data||[];state.inventory=inv.error?[]:(inv.data||[]);state.repairCosts=rc.error?[]:(rc.data||[]);state.photos=[];for(const x of (ph.data||[])){const signed=await sb.storage.from("agcell-photos").createSignedUrl(x.storage_path,3600);state.photos.push({...x,url:signed.data?.signedUrl||""})}saveCache()}
async function signOut(){await sb.auth.signOut();sessionStorage.removeItem("agcell_unlocked");location.reload()}
async function boot(){
  loadCache();

  if(location.hash.includes("type=recovery")){
    showResetPassword();
    return;
  }

  const {data}=await sb.auth.getSession();
  state.session=data.session;

  if(!state.session){
    showAuth();
    return;
  }

  if(locked()){
    render();
    return;
  }

  await loadCloud();
  render();
}
function showAuth(){document.getElementById("app").innerHTML=`<div class="login"><div class="box card"><h1>AG_CELL</h1><p>Servicio Técnico</p><p><b>La tecnología merece una segunda oportunidad</b></p><p>Conecta tu cuenta para sincronizar entre celular y computador.</p><label>Correo</label><input id="auth_email" type="email" placeholder="tu-correo@ejemplo.com"><label>Contraseña</label><input id="auth_pass" type="password" placeholder="Mínimo 6 caracteres"><div class="actions"><button onclick="authLogin()">Entrar</button><button class="ghost" onclick="authSignup()">Crear cuenta</button></div><p class="small muted">Si acabas de crear la cuenta, Supabase puede pedir confirmación del correo según la configuración del proyecto.</p></div></div>`}
async function authLogin(){const {data,error}=await sb.auth.signInWithPassword({email:$("auth_email").value.trim(),password:$("auth_pass").value});if(error){toast(error.message,true);return}state.session=data.session;state.cryptoKey=await deriveKey($("auth_pass").value);await ensurePin();await loadCloud();render()}
async function authSignup(){const email=$("auth_email").value.trim(),password=$("auth_pass").value;if(!email||password.length<6){toast("Correo y contraseña válida son obligatorios",true);return}const {data,error}=await sb.auth.signUp({email,password});if(error){toast(error.message,true);return}if(data.session){state.session=data.session;state.cryptoKey=await deriveKey(password);await ensurePin();await loadCloud();render()}else toast("Cuenta creada. Revisa tu correo para confirmar y luego entra.")}

function showResetPassword(){

    <div class="login">

        </div>
      </div>
    </div>`;
}

async function saveNewPassword(){
  const p=$("reset_pass").value;
  const p2=$("reset_pass2").value;

  if(p.length<6){
    toast("La contraseña debe tener mínimo 6 caracteres",true);
    return;
  }

  if(p!==p2){
    toast("Las contraseñas no coinciden",true);
    return;
  }

  const {error}=await sb.auth.updateUser({password:p});

  if(error){
    toast(error.message,true);
    return;
  }

  toast("Contraseña actualizada correctamente");

  setTimeout(()=>{
    location.href="./";
  },1200);
}

if(location.hash.includes("type=recovery")){
  setTimeout(()=>showResetPassword(),300);
}if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;window.dispatchEvent(new Event("agcell-install-ready"));});
boot();
